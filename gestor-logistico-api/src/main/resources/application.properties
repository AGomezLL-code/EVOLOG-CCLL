spring.application.name=gestor-logistico-api

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestor_logistico_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones optimizado para planes gratuitos (Render + Aiven)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# En producción (Render) evita llenar la consola de logs SQL
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR Y PUERTO
# ==========================================
server.port=${PORT:8080}
server.servlet.context-path=/

# ==========================================
# SEGURIDAD JWT
# ==========================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000
