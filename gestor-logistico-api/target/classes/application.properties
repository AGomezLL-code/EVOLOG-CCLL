spring.application.name=gestor-logistico-api

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_logistico_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
# 'validate': Comprueba que las entidades JPA coincidan con el DDL SQL que ejecutaste en MySQL.
# Evita que Hibernate altere o borre tus tablas existentes.
spring.jpa.hibernate.ddl-auto=update

# Dialecto SQL actualizado para MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Formato y log de consultas SQL en consola (útil para depuración en desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR Y PUERTO
# ==========================================
server.port=8080
server.servlet.context-path=/


jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
